[project]
name = "regression-agent"
version = "0.1.0"
description = "Compare the current and the new build page by page (Build Mart React 16 vs React 19)"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2,<1.0",
    "jsonschema>=4.21,<5.0",
    "playwright>=1.47,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<10.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
